<meta name="description" content="Data-driven weekly rankings of Korean drama and K-pop fashion styles. Hybrid-scored from Google Trends, drama viewership, hashtag volume and community votes.">
<meta property="og:title" content="KStyleRank — Korean Fashion Style Rankings">
<meta property="og:description" content="Weekly rankings of K-drama and K-pop fashion. Vote for your favourites and see what's trending in Seoul.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0a0a0a;--cream:#f5f2ee;--warm:#ece7e0;--muted:#7a7672;--hint:#a09c97;--rule:rgba(10,10,10,0.1);--gold:#b8975a;--green:#3B6D11;--red:#A32D2D}
body{background:var(--cream);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:300;font-size:13px}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:0.5px solid var(--rule);padding:11px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:19px;letter-spacing:0.18em;text-transform:uppercase;white-space:nowrap}
.logo b{color:var(--gold);font-weight:300}
.nav-links{display:flex;gap:20px}
.nl{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-decoration:none;transition:color .2s}
.nl:hover,.nl.active{color:var(--ink)}
.issue{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--hint);white-space:nowrap}

/* ALGO BAR */
.algo{display:flex;gap:8px;align-items:center;padding:7px 28px;background:var(--warm);border-bottom:0.5px solid var(--rule);flex-wrap:wrap}
.algo-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.algo-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.algo-sep{color:var(--hint);font-size:14px;line-height:1}

/* MAIN */
.main{padding:16px 28px 40px}
.filters{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.fp{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;padding:4px 10px;border:0.5px solid var(--rule);background:var(--cream);color:var(--muted);cursor:pointer;border-radius:3px;transition:all .15s;font-family:'Montserrat',sans-serif;font-weight:400}
.fp:hover{background:var(--warm);color:var(--ink)}
.fp.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.sec-label{font-size:8px;letter-spacing:0.26em;text-transform:uppercase;color:var(--hint);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:0.5px;background:var(--rule)}

/* GRID — 3 cols, compact cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.grid{grid-template-columns:1fr}}

/* CARD */
.card{background:var(--cream);border:0.5px solid var(--rule);border-radius:6px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:rgba(10,10,10,0.28)}
.card.top{border-color:var(--gold)}
.photo-wrap{position:relative;overflow:hidden}
/* aspect-ratio 2:3 — compact */
.photo{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--warm);transition:transform .3s}
.card:hover .photo{transform:scale(1.04)}
.rank-badge{position:absolute;top:7px;left:7px;font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:0.1em;background:rgba(245,242,238,0.92);color:var(--ink);padding:1px 6px;border:0.5px solid rgba(10,10,10,0.14)}
.rank-badge.gold{background:rgba(184,151,90,0.9);color:#fff}
.view-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(10,10,10,0.5);color:var(--cream);font-size:8px;letter-spacing:0.16em;text-transform:uppercase;text-align:center;padding:5px;opacity:0;transition:opacity .2s}
.card:hover .view-hint{opacity:1}

/* SIGNALS */
.signals{display:flex;border-top:0.5px solid var(--rule);border-bottom:0.5px solid var(--rule)}
.sig{flex:1;padding:3px 0;text-align:center;border-right:0.5px solid var(--rule)}
.sig:last-child{border-right:none}
.sig-l{font-size:6px;letter-spacing:0.06em;text-transform:uppercase;color:var(--hint);display:block}
.sig-v{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:300}
.sig-v.g{color:var(--green)}.sig-v.m{color:var(--gold)}.sig-v.lo{color:var(--muted)}

/* CARD BODY */
.cbody{padding:7px 8px 9px}
.crank{font-size:7px;letter-spacing:0.18em;text-transform:uppercase;color:var(--hint);margin-bottom:2px}
.cname{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:300;letter-spacing:0.03em;margin-bottom:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cmeta{font-size:8px;color:var(--muted);font-style:italic;font-family:'Cormorant Garamond',serif;margin-bottom:4px;line-height:1.3}
.tags{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.tag{font-size:6.5px;letter-spacing:0.1em;text-transform:uppercase;padding:1px 4px;border:0.5px solid var(--rule);color:var(--muted)}
.tag.drama{border-color:var(--ink);color:var(--ink)}
.tag.kpop{border-color:var(--gold);color:var(--gold)}
.tag.hot{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.cfoot{display:flex;align-items:center;justify-content:space-between}
.cscore{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;line-height:1}
.cscore sub{font-size:8px;color:var(--muted);font-family:'Montserrat',sans-serif;vertical-align:baseline}
.cvotes{font-size:7px;letter-spacing:0.07em;text-transform:uppercase;color:var(--hint);margin-top:1px}
.delta{font-size:8px;font-weight:400}
.delta.u{color:var(--green)}.delta.d{color:var(--red)}.delta.f{color:var(--hint)}
.vbtns{display:flex;border:0.5px solid var(--rule)}
.vb{width:24px;height:20px;background:transparent;border:none;border-right:0.5px solid var(--rule);cursor:pointer;font-size:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .15s}
.vb:last-child{border-right:none}
.vb:hover{background:var(--warm);color:var(--ink)}
.vb.vup{background:var(--ink);color:var(--cream)}
.vb.vdn{background:#FCEBEB;color:var(--red)}
.bar-track{height:1px;background:var(--rule);margin-top:5px;overflow:hidden}
.bar-fill{height:1px;background:var(--ink);transition:width .4s ease}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:all}

/* DRAWER */
.drawer{position:fixed;top:0;right:0;width:min(420px,100vw);height:100vh;background:var(--cream);z-index:101;transform:translateX(105%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;border-left:0.5px solid var(--rule)}
.drawer.open{transform:translateX(0)}
.d-topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--cream);border-bottom:0.5px solid var(--rule)}
.d-topbar-title{font-size:8px;letter-spacing:0.22em;text-transform:uppercase;color:var(--hint)}
.d-close-btn{width:26px;height:26px;background:var(--warm);border:0.5px solid var(--rule);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s}
.d-close-btn:hover{background:var(--ink);color:var(--cream)}

/* Drawer hero 16:9 compact */
.d-hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--warm)}
.d-body{padding:13px}
.d-eyebrow{font-size:8px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.d-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:300;letter-spacing:0.04em;margin-bottom:3px}
.d-source{font-size:10px;color:var(--muted);font-style:italic;font-family:'Cormorant Garamond',serif;margin-bottom:10px;line-height:1.5}
.score-row{display:flex;gap:4px;margin-bottom:10px}
.score-box{flex:1;padding:6px;background:var(--warm);border:0.5px solid var(--rule);border-radius:3px;text-align:center}
.score-box-l{font-size:7px;letter-spacing:0.12em;text-transform:uppercase;color:var(--hint);margin-bottom:2px}
.score-box-v{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300}
.score-box-v.gold{color:var(--gold)}
.sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px}
.sig-box{padding:5px;background:var(--warm);border-radius:3px;text-align:center}
.sig-box-l{font-size:6.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--hint);margin-bottom:2px}
.sig-box-v{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:300}
.d-section{font-size:8px;letter-spacing:0.22em;text-transform:uppercase;color:var(--hint);margin:11px 0 6px;padding-bottom:4px;border-bottom:0.5px solid var(--rule)}

/* Drama photos — 3 col, 3:4 portrait */
.drama-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:3px}
.dp-wrap{border-radius:3px;overflow:hidden}
.dp-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--warm)}
.dp-cap{font-size:8px;color:var(--muted);text-align:center;font-style:italic;font-family:'Cormorant Garamond',serif;line-height:1.3;margin-top:2px}
.photo-note{font-size:8px;color:var(--hint);margin:6px 0 10px;padding:5px 7px;background:var(--warm);border-radius:3px;border-left:2px solid var(--gold);line-height:1.5}

/* Outfit */
.outfit-list{display:flex;flex-direction:column;gap:4px}
.outfit-item{display:flex;align-items:flex-start;gap:7px;padding:6px;background:var(--warm);border-radius:3px}
.outfit-icon{width:22px;height:22px;background:var(--cream);border:0.5px solid var(--rule);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.outfit-name{font-size:11px;font-weight:500;color:var(--ink);margin-bottom:1px}
.outfit-desc{font-size:9.5px;color:var(--muted);line-height:1.4}

/* Drama sources */
.drama-list{display:flex;flex-direction:column;gap:4px}
.drama-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border:0.5px solid var(--rule);border-radius:3px}
.drama-name{font-family:'Cormorant Garamond',serif;font-size:12px;font-weight:300;color:var(--ink)}
.drama-detail{font-size:9px;color:var(--muted);margin-top:1px}
.drama-right{text-align:right;flex-shrink:0}
.dbadge{font-size:7px;letter-spacing:0.1em;text-transform:uppercase;padding:2px 5px;border-radius:2px;font-weight:400}
.dbadge.high{background:#EAF3DE;color:#27500A}
.dbadge.mid{background:#FAEEDA;color:#633806}
.drating{font-size:8px;color:var(--hint);margin-top:2px}

/* SHOP THIS LOOK */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.shop-card{border:0.5px solid var(--rule);border-radius:3px;overflow:hidden;text-decoration:none;display:block;transition:border-color .15s;background:var(--cream)}
.shop-card:hover{border-color:rgba(10,10,10,0.3)}
.shop-photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--warm)}
.shop-body{padding:6px 7px 8px}
.shop-name{font-size:10px;font-weight:500;color:var(--ink);margin-bottom:1px;line-height:1.3}
.shop-brand{font-size:9px;color:var(--muted);margin-bottom:3px}
.shop-price{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--ink)}
.shop-cta{display:inline-block;margin-top:4px;font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border:0.5px solid var(--gold);padding:2px 6px;border-radius:2px}
.shop-disclaimer{font-size:8px;color:var(--hint);margin-top:7px;padding:5px 7px;background:var(--warm);border-radius:3px;line-height:1.5}

/* Vote row */
.d-vote-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding:8px 10px;border:0.5px solid var(--rule);border-radius:3px;background:var(--warm)}
.d-vote-label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)}
.d-vote-sub{font-size:9px;color:var(--hint);margin-top:1px}
.d-vbtns{display:flex;gap:4px;flex-shrink:0}
.d-vb{padding:5px 10px;border:0.5px solid var(--rule);background:var(--cream);cursor:pointer;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);border-radius:3px;transition:all .15s;font-family:'Montserrat',sans-serif}
.d-vb:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.d-vb.dvup{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.d-vb.dvdn{background:#FCEBEB;color:var(--red);border-color:#F7C1C1}

/* Toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(5px);z-index:200;font-size:8px;letter-spacing:0.2em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:7px 16px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

S.forEach(s=>{
  s.ds=Math.round(0.35*s.gt+0.35*s.hs+0.30*s.vs);
  s.vs2=Math.round(s.nlr*100);
  s.fs=Math.round(0.60*s.ds+0.40*s.vs2);
});

let filter='all', openId=null;
function gc(v){return v>=80?'g':v>=60?'m':'lo'}

function render(){
  const sorted=[...S].sort((a,b)=>b.fs-a.fs);
  const top=sorted[0].fs;
  const list=filter==='all'?sorted:sorted.filter(s=>s.tags.includes(filter));
  document.getElementById('grid').innerHTML=list.map(s=>{
    const rank=sorted.indexOf(s)+1;
    const bar=Math.round(s.fs/top*100);
    const dl=s.delta==='u'?`<span class="delta u">▲${s.dv}</span>`:s.delta==='d'?`<span class="delta d">▼${s.dv}</span>`:`<span class="delta f">—</span>`;
    const tgs=s.tags.map(t=>`<span class="tag ${t}">${t==='drama'?'K-Drama':t==='kpop'?'K-Pop':t==='street'?'Seoul St.':'Rising'}</span>`).join('');
    return`<div class="card${rank===1?' top':''}" onclick="openDrawer(${s.id})">
      <div class="photo-wrap">
        <img class="photo" src="${s.img}" alt="${s.name}" loading="lazy">
        <div class="rank-badge${rank===1?' gold':''}">No.${String(rank).padStart(2,'0')}</div>
        <div class="view-hint">Details + Shop</div>
      </div>
      <div class="signals">
        <div class="sig"><span class="sig-l">Trends</span><span class="sig-v ${gc(s.gt)}">${s.gt}</span></div>
        <div class="sig"><span class="sig-l">Hashtag</span><span class="sig-v ${gc(s.hs)}">${s.hs}</span></div>
        <div class="sig"><span class="sig-l">Drama</span><span class="sig-v ${gc(s.vs)}">${s.vs}</span></div>
        <div class="sig"><span class="sig-l">Score</span><span class="sig-v">${s.fs}</span></div>
      </div>
      <div class="cbody">
        <div class="crank">No.${String(rank).padStart(2,'0')} · Apr 2026</div>
        <div class="cname">${s.name} ${dl}</div>
        <div class="cmeta">${s.meta}</div>
        <div class="tags">${tgs}</div>
        <div class="cfoot">
          <div><div class="cscore">${s.fs}<sub> /100</sub></div><div class="cvotes">${s.cv.toLocaleString()} votes</div></div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
            <span style="font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:var(--hint)">Wear·Skip</span>
            <div class="vbtns">
              <button class="vb${s.liked?' vup':''}" onclick="event.stopPropagation();vote(${s.id},1)">▲</button>
              <button class="vb${s.disliked?' vdn':''}" onclick="event.stopPropagation();vote(${s.id},-1)">▼</button>
            </div>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${bar}%"></div></div>
      </div>
    </div>`;
  }).join('');
  if(openId!==null){
    const s=S.find(x=>x.id===openId);
    if(s){const sorted2=[...S].sort((a,b)=>b.fs-a.fs);fillDrawer(s,sorted2.indexOf(s)+1);}
  }
}

function fillDrawer(s,rank){
  document.getElementById('d-hero').src=s.img;
  document.getElementById('d-hero').alt=s.name;
  const tgs=s.tags.map(t=>`<span class="tag ${t}" style="font-size:8px;padding:2px 6px">${t==='drama'?'K-Drama':t==='kpop'?'K-Pop':t==='street'?'Seoul Street':'Rising'}</span>`).join('');
  document.getElementById('d-body').innerHTML=`
    <div class="d-eyebrow">No.${String(rank).padStart(2,'0')} · April 2026 ranking</div>
    <div class="d-title">${s.name}</div>
    <div class="d-source">${s.source}</div>
    <div class="tags" style="margin-bottom:10px">${tgs}</div>
    <div class="score-row">
      <div class="score-box"><div class="score-box-l">Final score</div><div class="score-box-v gold">${s.fs}<span style="font-size:9px;color:var(--hint);font-family:'Montserrat',sans-serif"> /100</span></div></div>
      <div class="score-box"><div class="score-box-l">Data 60%</div><div class="score-box-v">${s.ds}</div></div>
      <div class="score-box"><div class="score-box-l">Votes 40%</div><div class="score-box-v">${s.vs2}</div></div>
    </div>
    <div class="sig-grid">
      <div class="sig-box"><div class="sig-box-l">Google Trends</div><div class="sig-box-v ${gc(s.gt)}">${s.gt}</div></div>
      <div class="sig-box"><div class="sig-box-l">Hashtag freq.</div><div class="sig-box-v ${gc(s.hs)}">${s.hs}</div></div>
      <div class="sig-box"><div class="sig-box-l">Viewership</div><div class="sig-box-v ${gc(s.vs)}">${s.vs}</div></div>
    </div>

    <div class="d-section">As seen in — drama &amp; concert moments</div>
    <div class="drama-photos">
      ${s.dramaPhotos.map(p=>`<div class="dp-wrap"><img class="dp-img" src="${p.url}" alt="${p.cap}" loading="lazy"></div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:3px">
      ${s.dramaPhotos.map(p=>`<div class="dp-cap">${p.cap}</div>`).join('')}
    </div>
    <div class="photo-note">📷 Editorial placeholder photos · Replace with official press kit images from Netflix Korea, tvN, or agency PR for the live site.</div>

    <div class="d-section">Outfit breakdown</div>
    <div class="outfit-list">
      ${s.outfit.map(o=>`<div class="outfit-item"><div class="outfit-icon">${o.icon}</div><div><div class="outfit-name">${o.name}</div><div class="outfit-desc">${o.desc}</div></div></div>`).join('')}
    </div>

    <div class="d-section">Drama &amp; idol sources</div>
    <div class="drama-list">
      ${s.dramas.map(d=>`<div class="drama-item">
        <div><div class="drama-name">${d.name}</div><div class="drama-detail">${d.detail}</div></div>
        <div class="drama-right"><div class="dbadge ${d.badge}">${d.badge==='high'?'Strong':'Moderate'}</div><div class="drating">${d.rating}</div></div>
      </div>`).join('')}
    </div>

    <div class="d-section">Shop this look</div>
    <div class="shop-grid">
      ${s.shop.map(p=>`<a class="shop-card" href="${p.url}" target="_blank" rel="noopener noreferrer">
        <img class="shop-photo" src="${p.img}" alt="${p.name}" loading="lazy">
        <div class="shop-body">
          <div class="shop-name">${p.name}</div>
          <div class="shop-brand">${p.brand}</div>
          <div class="shop-price">${p.price}</div>
          <div class="shop-cta">Shop at ${p.retailer} ↗</div>
        </div>
      </a>`).join('')}
    </div>
    <div class="shop-disclaimer">Links are editorial suggestions. Replace with real affiliate links from ASOS, YesStyle, Revolve, or Musinsa affiliate programmes to earn commission.</div>

    <div class="d-vote-row">
      <div><div class="d-vote-label">Cast your vote</div><div class="d-vote-sub">${s.cv.toLocaleString()} votes · score updates live</div></div>
      <div class="d-vbtns">
        <button class="d-vb${s.liked?' dvup':''}" onclick="vote(${s.id},1)">▲ Wear it</button>
        <button class="d-vb${s.disliked?' dvdn':''}" onclick="vote(${s.id},-1)">▼ Skip it</button>
      </div>
    </div>`;
}

function openDrawer(id){
  openId=id;
  const sorted=[...S].sort((a,b)=>b.fs-a.fs);
  const s=S.find(x=>x.id===id);
  fillDrawer(s,sorted.indexOf(s)+1);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').scrollTop=0;
}

function closeDrawer(){
  openId=null;
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function vote(id,dir){
  const s=S.find(x=>x.id===id);if(!s)return;
  if(dir===1){
    if(s.liked){s.liked=false;s.cv--;s.nlr=Math.max(0,s.nlr-0.01);showToast('Vote removed')}
    else{if(s.disliked){s.disliked=false;s.cv--;s.nlr=Math.min(1,s.nlr+0.01)}s.liked=true;s.cv++;s.nlr=Math.min(1,s.nlr+0.01);showToast('Wear it — noted')}
  }else{
    if(s.disliked){s.disliked=false;s.cv--;s.nlr=Math.min(1,s.nlr+0.01);showToast('Vote removed')}
    else{if(s.liked){s.liked=false;s.cv--;s.nlr=Math.max(0,s.nlr-0.01)}s.disliked=true;s.cv++;s.nlr=Math.max(0,s.nlr-0.01);showToast('Skip it — noted')}
  }
  s.vs2=Math.round(s.nlr*100);
  s.fs=Math.round(0.60*s.ds+0.40*s.vs2);
  render();
}

function setF(el,f){
  document.querySelectorAll('.fp').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');filter=f;render();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);
}

render();
</script>
</body>
</html>
